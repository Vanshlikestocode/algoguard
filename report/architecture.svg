<svg viewBox="0 0 720 330" width="100%" role="img" aria-label="AlgoGuard architecture: data feeds strategies, risk engine gates orders, backtester and broker execute, audit log records">
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
    <style>.b{fill:#fff;stroke:#1F6F8B;stroke-width:1.4}.bs{fill:#e8f1f4;stroke:#1F6F8B;stroke-width:1.4}.t{font-size:12px;font-weight:700;fill:#1b2430}.s{font-size:9.5px;fill:#5b6675}.f{font-size:9px;fill:#1F6F8B;font-family:Menlo,monospace}.ln{stroke:#5b6675;stroke-width:1.3;fill:none;marker-end:url(#a)}.g{font-size:10px;font-weight:700;fill:#9a6b00}</style>
    <!-- row 1: AlgoGuard -->
    <text x="0" y="14" class="g">ALGOGUARD · risk-controlled execution</text>
    <rect x="0" y="24" width="125" height="70" rx="4" class="b"/><text x="10" y="44" class="t">Market data</text><text x="10" y="60" class="s">12 NSE large caps, NIFTY,</text><text x="10" y="72" class="s">India VIX, daily, CSV cache</text><text x="10" y="87" class="f">data.py</text>
    <rect x="148" y="24" width="125" height="70" rx="4" class="b"/><text x="158" y="44" class="t">Strategies</text><text x="158" y="60" class="s">EMA 20/100, Donchian</text><text x="158" y="72" class="s">55/20, RSI-2. Long only</text><text x="158" y="87" class="f">strategies.py</text>
    <rect x="296" y="24" width="140" height="70" rx="4" class="bs"/><text x="306" y="44" class="t">Risk engine</text><text x="306" y="60" class="s">6 rules + profiles + v2</text><text x="306" y="72" class="s">block entry / force exit</text><text x="306" y="87" class="f">risk.py v2.py</text>
    <rect x="459" y="24" width="125" height="70" rx="4" class="b"/><text x="469" y="44" class="t">Backtester</text><text x="469" y="60" class="s">fill next open, stops</text><text x="469" y="72" class="s">intraday, 0.15%/side</text><text x="469" y="87" class="f">backtest.py</text>
    <rect x="607" y="24" width="113" height="70" rx="4" class="b"/><text x="617" y="44" class="t">Broker layer</text><text x="617" y="60" class="s">SEBI retail algo</text><text x="617" y="72" class="s">rules, paper + Kite</text><text x="617" y="87" class="f">broker.py</text>
    <path d="M125,59 H146" class="ln"/><path d="M273,59 H294" class="ln"/><path d="M436,59 H457" class="ln"/><path d="M584,59 H605" class="ln"/>
    <!-- row 2 -->
    <rect x="296" y="122" width="140" height="58" rx="4" class="b"/><text x="306" y="141" class="t">Commitment lock</text><text x="306" y="156" class="s">tighten now, loosen later</text><text x="306" y="171" class="f">commitment.py</text>
    <path d="M366,122 V96" class="ln"/>
    <rect x="459" y="122" width="125" height="58" rx="4" class="b"/><text x="469" y="141" class="t">Audit log</text><text x="469" y="156" class="s">every block, pause, halt</text><text x="469" y="171" class="f">results/audit_log_*.csv</text>
    <path d="M436,130 H457" class="ln"/>
    <rect x="607" y="122" width="113" height="58" rx="4" class="b"/><text x="617" y="141" class="t">Explain + metrics</text><text x="617" y="156" class="s">plain-English day</text><text x="617" y="171" class="f">explain.py metrics.py</text>
    <path d="M584,151 H605" class="ln"/>
    <rect x="0" y="122" width="273" height="58" rx="4" class="b"/><text x="10" y="141" class="t">Dashboard</text><text x="10" y="156" class="s">profiles, rule toggles, lock, explain-a-day, scanner</text><text x="10" y="171" class="f">app.py  (algoguard.streamlit.app)</text>
    <!-- row 3: VolSelect -->
    <text x="0" y="214" class="g">VOLSELECT · volatility-aware selection (walk-forward, refit every 1 January)</text>
    <rect x="0" y="224" width="125" height="70" rx="4" class="b"/><text x="10" y="244" class="t">NIFTY 50 data</text><text x="10" y="260" class="s">50 stocks + sectors,</text><text x="10" y="272" class="s">NIFTY, India VIX</text><text x="10" y="287" class="f">universe.py</text>
    <rect x="148" y="224" width="125" height="70" rx="4" class="b"/><text x="158" y="244" class="t">Regime forecast</text><text x="158" y="260" class="s">VIX, realised vol, GARCH</text><text x="158" y="272" class="s">→ calm / rising / high</text><text x="158" y="287" class="f">regime.py</text>
    <rect x="296" y="224" width="140" height="70" rx="4" class="b"/><text x="306" y="244" class="t">Stock features</text><text x="306" y="260" class="s">19 per stock, ranked</text><text x="306" y="272" class="s">across stocks each day</text><text x="306" y="287" class="f">features.py</text>
    <rect x="459" y="224" width="125" height="70" rx="4" class="b"/><text x="469" y="244" class="t">Selection model</text><text x="469" y="260" class="s">one model per regime</text><text x="469" y="272" class="s">LR (GB as a check)</text><text x="469" y="287" class="f">selection.py</text>
    <rect x="607" y="224" width="113" height="70" rx="4" class="bs"/><text x="617" y="244" class="t">Portfolio</text><text x="617" y="260" class="s">weekly top 10, inv-vol,</text><text x="617" y="272" class="s">drawdown re-think</text><text x="617" y="287" class="f">portfolio.py</text>
    <path d="M125,259 H146" class="ln"/><path d="M273,259 H294" class="ln"/><path d="M436,259 H457" class="ln"/><path d="M584,259 H605" class="ln"/>
    <text x="0" y="322" class="s">Shared: indicators.py (EMA, RSI, ATR, ADX, MACD, %B, OBV, stochastic), metrics.py, data.py. Drivers: run.py, run_vs.py, verify.py.</text>
  </svg>