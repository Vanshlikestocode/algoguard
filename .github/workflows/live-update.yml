name: Daily live paper-trading update

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 18:00 IST, Monday to Friday, after the NSE close (15:30 IST)
  workflow_dispatch: {}         # run by hand from the Actions tab

permissions:
  contents: write              # to commit the day's record

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python live_update.py
      - name: Commit the day's record
        run: |
          git config user.name "algoguard-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          if git diff --cached --quiet; then
            echo "Nothing new (market holiday or no new bar)."
          else
            git commit -m "Live paper record: session of $(python -c 'import json;print(json.load(open("live/status.json"))["last_completed_session"])')"
            git push
          fi
